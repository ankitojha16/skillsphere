events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format enterprise '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" upstream: $upstream_addr '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log enterprise;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Rate limiting & connection boundaries (DoS protection)
    # 100r/s with burst=120 accommodates shared campus NATs while mitigating volumetric abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Trusted proxy network configuration (Do not trust arbitrary client headers)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream skillsphere_cluster {
        # Round-robin distribution across independent application instances
        server web_instance_1:8000 max_fails=3 fail_timeout=10s;
        server web_instance_2:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost staging.skillsphere.local;

        # Connection limits tuned for modern browsers (multiple TCP streams per client)
        limit_conn conn_limit 100;

        # Health probe passthrough for external cloud load balancers
        location /health/ {
            proxy_pass http://skillsphere_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Dedicated Static Asset Bypass (excludes static files from API rate limit buckets)
        location /static/ {
            proxy_pass http://skillsphere_cluster;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Media and generated documents (large streaming downloads, resumes, certs)
        location /media/ {
            proxy_pass http://skillsphere_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }

        # WebSocket support for lounge / collaboration channels
        location /ws/ {
            proxy_pass http://skillsphere_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # General web & API traffic
        location / {
            limit_req zone=api_limit burst=120 nodelay;

            proxy_pass http://skillsphere_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Streaming support for large file downloads (resumes, certificates)
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
