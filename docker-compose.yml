version: '3.8'

services:
  web:
    build: .
    container_name: skillsphere_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skillsphere_staging
      - REDIS_URL=redis://redis:6379/0
      - CONN_MAX_AGE=60
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: skillsphere_worker
    restart: always
    command: python -c "from services.task_queue import process_next_job; import time; print('Worker started'); [time.sleep(0.5) if not process_next_job() else None while True]"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/skillsphere_staging
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17-alpine
    container_name: skillsphere_db
    restart: always
    environment:
      - POSTGRES_DB=skillsphere_staging
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillsphere_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
