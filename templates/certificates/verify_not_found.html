<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Not Found - SkillSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0B1020;
            color: #F8FAFC;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="p-3">
    <div class="text-center p-4 p-md-5 rounded-4" style="background: #11182B; border: 1px solid rgba(239, 68, 68, 0.3); max-width: 500px;">
        <div class="p-3 rounded-circle d-inline-flex mb-3" style="background: rgba(239, 68, 68, 0.15); color: #EF4444;">
            <i data-lucide="alert-circle" style="width: 48px; height: 48px;"></i>
        </div>
        <h1 class="h4 fw-bold text-white mb-2">Certificate Not Verified</h1>
        <p class="text-secondary small mb-4">No authentic SkillSphere credential was found matching ID <code>{{ certificate_id }}</code>. Please verify the ID or contact the credential holder.</p>
        <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-4">Return to SkillSphere</a>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
