<!-- SkillSphere Beta Feedback Floating Trigger & Modal (Phase 15) -->
<div id="betaFeedbackFloatingWrap" class="position-fixed bottom-0 end-0 m-3 m-sm-4" style="z-index: 1040;">
    <button type="button" class="btn btn-dark border border-warning border-opacity-40 text-warning px-3 py-2 rounded-pill shadow-lg d-inline-flex align-items-center gap-2 hover-elevation" data-bs-toggle="modal" data-bs-target="#betaFeedbackModal" id="betaFeedbackTriggerBtn" title="Give Beta Feedback or Report Bug">
        <i data-lucide="message-square-plus" style="width: 16px; height: 16px;"></i>
        <span class="small fw-semibold d-none d-sm-inline">Beta Feedback</span>
        <span class="badge bg-warning text-dark rounded-pill px-1.5 py-0" style="font-size: 0.65rem;">Beta</span>
    </button>
</div>

<!-- Beta Feedback Modal -->
<div class="modal fade" id="betaFeedbackModal" tabindex="-1" aria-labelledby="betaFeedbackModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 520px;">
        <div class="modal-content custom-card border-0 shadow-lg" style="background-color: #0f172a; border: 1px solid rgba(245, 158, 11, 0.3) !important;">
            <div class="modal-header border-bottom pb-2.5" style="border-color: rgba(255, 255, 255, 0.08) !important;">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark rounded-pill px-2 py-0.5 small fw-bold">Beta</span>
                    <h6 class="modal-title fw-bold text-white mb-0" id="betaFeedbackModalLabel">Share Feedback &amp; Report Bugs</h6>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form id="betaFeedbackForm" method="post" action="{% url 'analytics:submit_feedback_api' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="hidden" name="page_url" id="feedbackPageUrl" value="">

                <div class="modal-body py-3 text-light">
                    <!-- Status message container -->
                    <div id="feedbackAlert" class="alert d-none small py-2 mb-3"></div>

                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label text-white small fw-semibold mb-1.5">What are you reporting?</label>
                        <div class="d-flex flex-wrap gap-1.5">
                            <input type="radio" class="btn-check" name="category" id="modal_cat_feedback" value="feedback" checked>
                            <label class="btn btn-sm btn-outline-secondary text-light px-2.5 py-1 rounded-pill" style="font-size: 0.78rem;" for="modal_cat_feedback">Suggestion</label>

                            <input type="radio" class="btn-check" name="category" id="modal_cat_bug" value="bug">
                            <label class="btn btn-sm btn-outline-secondary text-light px-2.5 py-1 rounded-pill" style="font-size: 0.78rem;" for="modal_cat_bug">Bug Report</label>

                            <input type="radio" class="btn-check" name="category" id="modal_cat_content" value="content">
                            <label class="btn btn-sm btn-outline-secondary text-light px-2.5 py-1 rounded-pill" style="font-size: 0.78rem;" for="modal_cat_content">Course Content</label>

                            <input type="radio" class="btn-check" name="category" id="modal_cat_feature" value="feature">
                            <label class="btn btn-sm btn-outline-secondary text-light px-2.5 py-1 rounded-pill" style="font-size: 0.78rem;" for="modal_cat_feature">Feature Idea</label>
                        </div>
                    </div>

                    <!-- Star Rating (Optional) -->
                    <div class="mb-3">
                        <label class="form-label text-white small fw-semibold mb-1">Rating (Optional)</label>
                        <div class="d-flex gap-1.5">
                            {% for s in "12345" %}
                            <input type="radio" class="btn-check" name="rating" id="modal_rate_{{ s }}" value="{{ s }}">
                            <label class="btn btn-sm btn-outline-warning px-2.5 py-0.5 rounded-pill" style="font-size: 0.78rem;" for="modal_rate_{{ s }}">★ {{ s }}</label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="feedbackModalDesc" class="form-label text-white small fw-semibold mb-1">Details / What happened?</label>
                        <textarea class="form-control form-control-sm" id="feedbackModalDesc" name="description" rows="3" placeholder="Tell us what you noticed or how we can improve..." required style="background: rgba(15, 23, 42, 0.9); color: #fff; border-color: rgba(255, 255, 255, 0.15);"></textarea>
                    </div>

                    <!-- Optional Screenshot -->
                    <div class="mb-2">
                        <label for="feedbackModalFile" class="form-label text-white small fw-semibold mb-1">Optional Screenshot</label>
                        <input class="form-control form-control-sm" type="file" id="feedbackModalFile" name="screenshot" accept="image/jpeg,image/png,image/webp,image/gif" style="background: rgba(15, 23, 42, 0.9); color: #fff; border-color: rgba(255, 255, 255, 0.15);">
                        <small class="text-muted" style="font-size: 0.72rem;">Max 5 MB (JPEG, PNG, WebP)</small>
                    </div>
                </div>

                <div class="modal-footer border-top pt-2.5" style="border-color: rgba(255, 255, 255, 0.08) !important;">
                    <button type="button" class="btn btn-sm btn-secondary-custom py-1.5 px-3 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="feedbackModalSubmitBtn" class="btn btn-sm btn-primary-custom py-1.5 px-4 rounded-pill d-inline-flex align-items-center gap-1.5">
                        <i data-lucide="send" style="width: 14px; height: 14px;"></i>
                        <span>Submit Report</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('betaFeedbackForm');
    var pageInput = document.getElementById('feedbackPageUrl');
    var modalEl = document.getElementById('betaFeedbackModal');
    var alertBox = document.getElementById('feedbackAlert');
    var submitBtn = document.getElementById('feedbackModalSubmitBtn');

    if (modalEl) {
        modalEl.addEventListener('show.bs.modal', function () {
            if (pageInput) {
                pageInput.value = window.location.pathname + window.location.search;
            }
            if (alertBox) {
                alertBox.className = 'alert d-none small py-2 mb-3';
                alertBox.textContent = '';
            }
        });
    }

    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Sending...';
            }

            var formData = new FormData(form);
            fetch(form.action, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    return { status: res.status, ok: res.ok, data: data };
                });
            })
            .then(function(result) {
                if (result.ok && result.data.success) {
                    if (alertBox) {
                        alertBox.className = 'alert alert-success small py-2 mb-3 d-block';
                        alertBox.textContent = result.data.message || 'Thank you! Your feedback has been received.';
                    }
                    form.reset();
                    setTimeout(function() {
                        var modalInstance = bootstrap.Modal.getInstance(modalEl);
                        if (modalInstance) modalInstance.hide();
                    }, 1400);
                } else {
                    if (alertBox) {
                        alertBox.className = 'alert alert-danger small py-2 mb-3 d-block';
                        alertBox.textContent = (result.data && result.data.error) ? result.data.error : 'Failed to submit feedback. Please try again.';
                    }
                }
            })
            .catch(function(err) {
                if (alertBox) {
                    alertBox.className = 'alert alert-danger small py-2 mb-3 d-block';
                    alertBox.textContent = 'Network error. Please try again.';
                }
            })
            .finally(function() {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i data-lucide="send" style="width: 14px; height: 14px;"></i> <span>Submit Report</span>';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            });
        });
    }
});
</script>
