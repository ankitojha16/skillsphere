{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Goal - SkillSphere{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="custom-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3" style="border-color: var(--border-color) !important;">
            <div>
                <h4 class="fw-bold mb-1">Edit Learning Goal</h4>
                <p class="text-secondary small mb-0">Update target timeline or description.</p>
            </div>
            <a href="{% url 'goals:index' %}" class="btn btn-secondary-custom btn-sm">Cancel</a>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.title.id_for_label }}">Goal Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label class="form-label" for="{{ form.description.id_for_label }}">Description</label>
                {{ form.description }}
            </div>

            <div class="mb-4">
                <label class="form-label" for="{{ form.target_date.id_for_label }}">Target Date</label>
                {{ form.target_date }}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary-custom flex-grow-1 justify-content-center py-2">
                    <i data-lucide="save" style="width: 16px; height: 16px;"></i>
                    <span>Save Changes</span>
                </button>
                <a href="{% url 'goals:index' %}" class="btn btn-secondary-custom">Back</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
