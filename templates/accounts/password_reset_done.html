{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Link Sent - SkillSphere{% endblock %}
{% block sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 py-5 px-3">
    <div class="custom-card card-glowing text-center p-4 p-md-5" style="max-width: 440px; width: 100%;">
        <div class="stat-icon purple mx-auto mb-3" style="width: 56px; height: 56px;">
            <i data-lucide="mail-check" style="width: 28px; height: 28px;"></i>
        </div>
        <h3 class="fw-bold mb-2">Check Your Email</h3>
        <p class="text-secondary small mb-4">We've dispatched password reset instructions to your email address if an account exists.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary-custom w-100 justify-content-center">Return to Login</a>
    </div>
</div>
{% endblock %}
