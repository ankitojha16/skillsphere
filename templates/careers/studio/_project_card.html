<div class="p-3 rounded-3 hover-card" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <a href="{% url 'careers:studio_project_detail' project.id %}" class="fw-bold text-white text-decoration-none hover-text-primary small">
            {{ project.title }}
        </a>
        <span class="badge {% if project.is_public %}bg-info text-dark{% else %}bg-dark text-muted border border-secondary border-opacity-25{% endif %}" style="font-size: 10px;">
            {% if project.is_public %}Public{% else %}Private{% endif %}
        </span>
    </div>

    <p class="text-secondary small mb-2" style="font-size: 12px;">{{ project.description|default:"No description"|truncatewords:12 }}</p>

    <div class="mb-2">
        <div class="d-flex justify-content-between text-muted" style="font-size: 10px;">
            <span>Milestones</span>
            <span>{{ project.get_progress_percentage }}%</span>
        </div>
        <div class="custom-progress" style="height: 4px;">
            <div class="custom-progress-bar" style="width: {{ project.get_progress_percentage }}%;"></div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center pt-2 border-top border-secondary border-opacity-10" style="font-size: 11px;">
        <span class="text-muted text-truncate" style="max-width: 120px;">{{ project.technology_stack }}</span>
        <a href="{% url 'careers:studio_project_detail' project.id %}" class="text-info text-decoration-none">
            Manage →
        </a>
    </div>
</div>
