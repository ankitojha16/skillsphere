<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Core Gradients -->
    <linearGradient id="ssRing1GradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="ssRing2GradFull" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="45%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="ssSphereSurfaceFull" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <radialGradient id="ssCoreGlowFull" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#C7D2FE" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ssAuraGlowFull" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ssBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="ssGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ssAuraBlurFull" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Left Icon Mark Container (Centered at x=44, y=40, scaled ~0.62) -->
  <g transform="translate(6, 2) scale(0.63)">
    <!-- Ambient Aura -->
    <circle cx="60" cy="60" r="50" fill="url(#ssAuraGlowFull)" filter="url(#ssAuraBlurFull)" />

    <!-- Back Ring Segments -->
    <g transform="rotate(-32 60 60)">
      <ellipse cx="60" cy="60" rx="51" ry="17" stroke="url(#ssRing2GradFull)" stroke-width="2.5" stroke-dasharray="140 180" stroke-dashoffset="15" opacity="0.45" />
    </g>
    <g transform="rotate(38 60 60)">
      <ellipse cx="60" cy="60" rx="53" ry="18" stroke="url(#ssRing1GradFull)" stroke-width="3" stroke-dasharray="150 180" stroke-dashoffset="18" opacity="0.5" />
    </g>

    <!-- Sphere Body -->
    <circle cx="60" cy="60" r="28" fill="url(#ssSphereSurfaceFull)" />

    <!-- Meridian Grid -->
    <ellipse cx="60" cy="50" rx="26" ry="8" fill="none" stroke="#A5B4FC" stroke-width="1.2" opacity="0.35" />
    <ellipse cx="60" cy="60" rx="28" ry="10" fill="none" stroke="#E0E7FF" stroke-width="1.4" opacity="0.45" />
    <ellipse cx="60" cy="70" rx="25" ry="8" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.3" />
    <path d="M60 32 C 45 42, 45 78, 60 88" fill="none" stroke="#C7D2FE" stroke-width="1.2" opacity="0.4" />
    <path d="M60 32 C 75 42, 75 78, 60 88" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.4" />

    <!-- Specular Highlight -->
    <circle cx="60" cy="60" r="28" fill="url(#ssCoreGlowFull)" />

    <!-- Front Ring Segments -->
    <g transform="rotate(38 60 60)">
      <ellipse cx="60" cy="60" rx="53" ry="18" stroke="url(#ssRing1GradFull)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="160 170" stroke-dashoffset="195" filter="url(#ssGlowFull)" />
      <circle cx="113" cy="60" r="4.5" fill="#38BDF8" filter="url(#ssGlowFull)" />
      <circle cx="113" cy="60" r="2" fill="#FFFFFF" />
    </g>
    <g transform="rotate(-32 60 60)">
      <ellipse cx="60" cy="60" rx="51" ry="17" stroke="url(#ssRing2GradFull)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="150 170" stroke-dashoffset="190" filter="url(#ssGlowFull)" />
      <circle cx="9" cy="60" r="4" fill="#F43F5E" filter="url(#ssGlowFull)" />
      <circle cx="9" cy="60" r="1.8" fill="#FFFFFF" />
    </g>

    <!-- Center Radiant Star -->
    <path d="M60 52 Q60 60 52 60 Q60 60 60 68 Q60 60 68 60 Q60 60 60 52 Z" fill="#FFFFFF" filter="url(#ssGlowFull)" />
    <circle cx="60" cy="60" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Right Side Brand Typography -->
  <g transform="translate(92, 44)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.03em">
      <tspan fill="#FFFFFF">Skill</tspan>
      <tspan fill="url(#ssBrandGrad)">Sphere</tspan>
    </text>
    <!-- Subtitle / Tagline Badge -->
    <text y="18" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.8" font-weight="700" fill="#94A3B8" letter-spacing="0.22em">
      AUTONOMOUS LEARNING PLATFORM
    </text>
  </g>
</svg>
